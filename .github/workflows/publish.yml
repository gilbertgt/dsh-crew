name: Publish to npm

# Releases are cut by pushing a v* TAG, and only that. A plain push to main
# never publishes, so work in progress on main can never ship by accident.
# One tag = one run = one version, so two runs cannot race to publish the same
# version.
#
# Release flow: bump "version" in package.json, commit, push main, then push the
# matching v* tag.
#
# Auth is npm trusted publishing (OIDC): a short-lived token minted for this one
# run, verified against the publisher configured on npmjs.com. There is no
# secret to store or rotate.
#
# One-time setup on npmjs.com (dsh-crew -> Settings -> Trusted Publisher):
#   Organization or user: stuarthu
#   Repository:           dsh-crew
#   Workflow filename:    publish.yml
#   Environment:          (empty)
# Renaming this file breaks publishing until that setting is updated to match.

on:
  push:
    tags: ["v*"]

concurrency:
  # Keyed on the tag, so different releases never share a queue slot while
  # re-pushing the SAME tag still serializes against its own in-flight run.
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false # never cancel a publish mid-flight

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `gh release create` (the last step) writes the release page through
      # `contents`, so a release run needs write here — `contents: read` cannot
      # make one. There is no way to split this into a low-privilege publish job
      # and a separate release job: tools/verify-mount.mjs requires a publishing
      # workflow to have exactly ONE job, so `npm publish` runs with the same
      # grant. That cost is written down in the gh-release PRD, section eleven.
      contents: write
      id-token: write # required for OIDC trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, on purpose — the same reason as test.yml, because this
          # workflow runs the same `npm test`. Some QA cases under qa/ read
          # this repository's own commits (qa/T-01/case-26-repo-diff-scope.mjs
          # looks up commits by the task marker in their subject line). The
          # default here is a depth-1 shallow clone with no history, so those
          # checks fail — which is what happened: the v0.7.0 tag ran this
          # workflow, `npm test` went red on T-01, and the release stopped. It
          # stopped for the right reason and nothing was published, but the run
          # was red over the checkout and not over the code. tools/verify-mount.mjs
          # now asks this of EVERY workflow that runs `npm test`, so the next
          # workflow to run the suite cannot be forgotten the way this one was.
          fetch-depth: 0
          # The job token is not needed by any step here for git: nothing in this
          # workflow runs `git push`, and the last step authenticates `gh` through
          # its own GH_TOKEN env. Left at its default (`true` in v4 through v7 —
          # it has never changed), checkout writes that token to disk for the
          # whole job. Since v6.0.0 it lands in
          # $RUNNER_TEMP/git-credentials-<uuid>.config rather than .git/config,
          # with .git/config holding only an `include.path` to it — a different
          # file, not no file: every later step, action and npm package in this
          # job could still read it and push with it. See
          # docs/research/actions-checkout-persist-credentials.md.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # trusted publishing needs Node >= 22.14.0
          registry-url: "https://registry.npmjs.org"

      - name: Decide whether to publish
        id: guard
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # The tag names the release, so a tag that disagrees with package.json
          # would publish a version nobody asked for. Fail loudly instead.
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match package.json version $VERSION — fix the bump or the tag, then re-tag."
            exit 1
          fi
          # --json makes failures machine-readable: npm prints {"error":{"code":...}}
          # so E404 (not published yet) is detected structurally, not by grepping prose.
          set +e
          OUT=$(npm view "$NAME@$VERSION" version --json 2>stderr.txt)
          CODE=$?
          set -e
          if [ $CODE -eq 0 ] && [ -n "$OUT" ]; then
            echo "$NAME@$VERSION is already on npm — nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif node -e 'try { process.exit(JSON.parse(process.argv[1]).error.code === "E404" ? 0 : 1) } catch { process.exit(1) }' "$OUT"; then
            echo "$NAME@$VERSION not found (E404) — will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # Non-404 failure (network / registry 5xx / auth): fail the RUN, loudly.
            # A green skip here would silently lose the release.
            echo "::error::npm view failed for a non-404 reason — failing so the release isn't silently skipped. Re-run once the registry recovers."
            printf '%s\n' "$OUT"
            cat stderr.txt
            exit 1
          fi

      # BEFORE the publish, on purpose (interview answer 2): a CHANGELOG with no
      # section for this version has to stop the run while the version can still
      # be stopped. Once `npm publish` has run, that version is on npm for ever.
      # It sits before `npm test` as well, which only makes the failure arrive
      # about ten seconds in instead of after the whole suite — the ordering that
      # matters is this step before the publish.
      #
      # No `if:` on it: it runs on every v* tag.
      #
      # NOTHING TESTS THE SHELL BELOW. No unit test and no QA case executes it —
      # the user chose that knowingly (interview answers 5 and 6), and
      # qa/gaps.md carries the hole. tools/verify-mount.mjs pins where this
      # step sits and that it has an id and no `if:`; it reads not one character
      # of what is inside. The first real run of this code is the first v* tag
      # pushed after it landed.
      - name: Read the release notes from CHANGELOG.md
        id: notes
        run: |
          # The version comes from package.json, not from the tag: the step above
          # already refused to go on unless the two agree, and reading the tag a
          # second time here would only add a second way for them to disagree.
          VERSION=$(node -p "require('./package.json').version")
          # `## <version><space>` — the trailing space is the whole reason
          # `0.1.0` does not match the `## 0.10.0 — …` heading. Matched with
          # awk's index(), not a regex, so the dots in a version number are
          # literal dots and nothing has to be escaped.
          #
          # Exit codes out of awk: 0 notes written, 10 no such heading, 11 the
          # section is there but holds nothing except blank lines.
          #
          # 10 and 11, not 2 and 3, because the awk family exits 2 ON ITS OWN
          # when it cannot read the input file — mawk, which is what a GitHub
          # runner has, does exactly that. With 2 meaning "no such heading", a
          # missing or unreadable CHANGELOG.md printed "write the notes for
          # $VERSION into CHANGELOG.md", pointing whoever reads it at the wrong
          # fix. Every non-zero value that is not 10 or 11 now falls through to
          # the "awk exited $STATUS" catch-all below, where it belongs.
          set +e
          awk -v want="## $VERSION " '
            !done && index($0, want) == 1 { found = 1; next }
            found && !done && index($0, "## ") == 1 { done = 1 }
            found && !done { print; if ($0 ~ /[^ \t]/) filled = 1 }
            END { if (!found) exit 10; if (!filled) exit 11 }
          ' CHANGELOG.md > release-notes.md
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 10 ]; then
            echo "::error::CHANGELOG.md has no section starting with '## $VERSION ' — write the notes for $VERSION into CHANGELOG.md, then re-tag. Nothing has been published."
            exit 1
          elif [ "$STATUS" -eq 11 ]; then
            echo "::error::the '## $VERSION' section of CHANGELOG.md is empty — write what changed in $VERSION, then re-tag. Nothing has been published."
            exit 1
          elif [ "$STATUS" -ne 0 ]; then
            echo "::error::reading the $VERSION release notes out of CHANGELOG.md failed (awk exited $STATUS)."
            exit 1
          fi
          echo "release notes for $VERSION: $(wc -l < release-notes.md) line(s) from CHANGELOG.md"

      # No `npm install`: CI deliberately does not install this package's dependencies, and
      # @deepseek-ai/dsh-tool-subagent cannot be installed from the public
      # registry (its peer @deepseek-ai/dsh-tasks is not published). The checks
      # know this and say which one they skip — see tools/verify-mount.mjs.
      - name: Run checks
        run: npm test

      # Only the publish itself needs npm >= 11.5.1 (trusted publishing).
      - name: Ensure npm supports trusted publishing
        if: steps.guard.outputs.publish == 'true'
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: the npm CLI authenticates with the OIDC credential
      # granted by `id-token: write`, checked against the trusted publisher
      # configured on npmjs.com.
      - name: Publish
        if: steps.guard.outputs.publish == 'true'
        run: npm publish --provenance --access public

      # AFTER the publish, and gated on the same guard: a release page must not
      # announce a version that the publish then failed to put on npm, and
      # re-pushing a tag whose version is already on npm (publish=false) must not
      # make a second release.
      #
      # No --draft, no --prerelease, and above all no --generate-notes:
      # --generate-notes would write a summary out of commits and PRs, which is
      # exactly the text this whole change exists to replace. The notes are the
      # words from CHANGELOG.md, read by the step above.
      #
      # `gh` is pre-installed on ubuntu-latest, and GITHUB_TOKEN is the token the
      # runner already has — no third-party action, no secret to configure.
      - name: Create the GitHub release
        if: steps.guard.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
